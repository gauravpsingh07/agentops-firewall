# ---------------------------------------------------------------------------
# AgentOps Firewall — End-to-end tests (manual trigger)
#
# Runs the Playwright suite in frontend/e2e against a freshly built local
# stack. Triggered manually via the GitHub Actions UI (workflow_dispatch)
# to keep PR CI fast; promote to push/pull_request once the e2e suite is
# stable enough to be a gate.
#
# What this workflow does:
#   1. Brings up Postgres + Kafka + RabbitMQ via docker-compose
#   2. Builds and starts the Spring Boot backend on :8080 (local profile)
#   3. Builds the Angular frontend and serves the static bundle on :4200
#   4. Installs Playwright + Chromium and runs `npx playwright test`
#   5. Uploads the HTML report and traces on failure
# ---------------------------------------------------------------------------

name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start infra (Postgres, Kafka, RabbitMQ)
        run: docker compose up -d postgres kafka rabbitmq

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U agentops && break
            sleep 2
          done

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package

      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: agentops
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: local_dev_only
        run: |
          nohup java -jar target/firewall-0.1.0-SNAPSHOT.jar > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..40}; do
            curl -fsS http://localhost:8080/actuator/health && break
            sleep 2
          done

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Serve frontend (static)
        working-directory: frontend
        run: |
          npx --yes http-server dist/agentops-firewall-frontend/browser -p 4200 -a 127.0.0.1 -s > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:4200 >/dev/null && break
            sleep 2
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4200
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then kill $(cat backend/backend.pid) || true; fi
          if [ -f frontend/server.pid ]; then kill $(cat frontend/server.pid) || true; fi
          docker compose down -v || true
