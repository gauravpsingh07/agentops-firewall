# ---------------------------------------------------------------------------
# AgentOps Firewall — local development stack (Phase 0 skeleton).
# Backend and frontend services are commented out until their Dockerfiles
# are wired in later phases. Infra services (postgres, kafka, rabbitmq)
# are ready to be brought up now for local exploration.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d postgres kafka rabbitmq
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: agentops-kafka
    environment:
      # KRaft mode — single-node dev broker, no Zookeeper.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agentops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-agentops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local_dev_only}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    restart: unless-stopped

  # --- enabled in later phases ------------------------------------------------
  # backend:
  #   build: ./backend
  #   container_name: agentops-backend
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - ./.env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_started
  #     rabbitmq:
  #       condition: service_started
  #
  # frontend:
  #   build: ./frontend
  #   container_name: agentops-frontend
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - backend
  # ---------------------------------------------------------------------------

volumes:
  pgdata:
