# ---------------------------------------------------------------------------
# AgentOps Firewall — local development stack.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d              # full stack (infra + app)
#   docker compose up -d postgres kafka rabbitmq   # infra only
#
# All passwords / secrets are placeholders (`local_dev_only`, `CHANGE_ME`)
# and are safe to read here precisely because they are not real
# credentials. Do not put real values in this file.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    # Confluent's cp-kafka is the most widely deployed Kafka container
    # image — used in production at thousands of organizations, so its
    # layer manifests are well exercised on Docker Desktop / WSL2.
    #
    # We tried bitnami/kafka:3.7 first (the de-facto community image
    # for years), but Bitnami stopped publishing community Kafka
    # images on Docker Hub in August 2025, so that tag is no longer
    # pullable. We then tried apache/kafka:3.9.0 (the official
    # upstream), but on Docker Desktop 4.68 + WSL2 every file in
    # /etc/kafka and /opt/kafka extracted as 0 bytes (243/243 files
    # empty, including the Kafka JARs themselves), producing
    # `exec /__cacert_entrypoint.sh: exec format error` on start.
    # Pulling cleanly into a fresh WSL VM did not help, so the bug
    # is in how Docker Desktop handles that specific image's layer
    # manifest, not in our environment.
    #
    # cp-kafka 7.7.x corresponds to Apache Kafka 3.7.x and uses the
    # same KAFKA_* env-var convention as apache/kafka — no rename
    # of the broker config below was needed.
    image: confluentinc/cp-kafka:7.7.1
    container_name: agentops-kafka
    environment:
      # KRaft mode — single-node dev broker, no Zookeeper.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Required single-broker tunables: with one replica per topic the
      # internal __consumer_offsets / __transaction_state topics must
      # also be single-replicated, otherwise broker startup fails.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # KRaft requires a cluster id; any 22-char base64 string is fine
      # for a local single-broker setup.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agentops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-agentops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-local_dev_only}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: agentops-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agentops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agentops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-agentops}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-local_dev_only}
      JWT_SECRET: ${JWT_SECRET:-agentops_local_dev_only_placeholder_jwt_secret_change_me_please_thirtytwo_plus}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: agentops-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
