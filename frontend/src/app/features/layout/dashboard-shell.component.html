<div class="min-h-screen bg-agentops-bg text-slate-100 flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="md:hidden rounded p-1 text-slate-400 hover:text-white"
          aria-label="Toggle navigation"
          (click)="toggleMenu()"
        >
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <a routerLink="/dashboard" class="flex items-center gap-2">
          <span class="inline-block h-2 w-2 rounded-full bg-agentops-accent"></span>
          <span class="text-sm font-semibold tracking-wide text-white">AgentOps Firewall</span>
        </a>
      </div>
      <div class="flex items-center gap-3 text-sm">
        @if (user()) {
          <span class="hidden sm:inline text-slate-400">
            {{ user()!.username }}
            <span class="ml-1 rounded-sm bg-slate-800 px-1.5 py-0.5 text-[10px] uppercase text-slate-300">{{ user()!.role }}</span>
          </span>
        }
        <button
          type="button"
          (click)="logout()"
          class="rounded-md border border-slate-700 px-3 py-1 text-xs text-slate-200 hover:border-slate-500 hover:text-white"
        >
          Sign out
        </button>
      </div>
    </div>
  </header>

  <div class="mx-auto flex w-full max-w-7xl flex-1 gap-6 px-4 py-6">
    <aside
      class="w-56 shrink-0 space-y-1"
      [class.hidden]="!menuOpen()"
      [class.md:block]="true"
    >
      @for (item of visibleNav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          (click)="menuOpen.set(false)"
          class="block rounded-md px-3 py-2 text-sm text-slate-300 hover:bg-slate-800/60 hover:text-white"
        >
          {{ item.label }}
        </a>
      }
    </aside>

    <main class="flex-1 min-w-0">
      <router-outlet />
    </main>
  </div>
</div>
