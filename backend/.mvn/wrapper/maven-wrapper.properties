# Maven Wrapper configuration for AgentOps Firewall backend.
# The wrapper itself (mvnw / mvnw.cmd) will be added in Phase 1 via
# `mvn wrapper:wrapper`. For Phase 0, CI uses system Maven via setup-java.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
