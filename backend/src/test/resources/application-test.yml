# ---------------------------------------------------------------------------
# Test profile — H2 in-memory database, Flyway disabled.
# Hibernate creates/drops the schema based on the live @Entity classes,
# so tests do not depend on the Postgres-specific migrations.
# ---------------------------------------------------------------------------

spring:
  # Kafka autoconfiguration is left enabled so the KafkaTemplate bean
  # exists for autowiring. No real broker is contacted during tests:
  # tests that exercise publishing mock the AgentActionEventPublisher
  # bean, and producer-side tight timeouts (configured below) keep any
  # accidental send attempt from blocking the suite.
  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP:localhost:9999}
    producer:
      properties:
        max.block.ms: 500
        delivery.timeout.ms: 1000
        request.timeout.ms: 500

  # RabbitMQ autoconfiguration is excluded entirely in the test profile.
  # Tests that exercise approval-task publishing mock the
  # ApprovalTaskPublisher bean — no broker connection is needed.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  datasource:
    url: jdbc:h2:mem:agentops-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

agentops:
  messaging:
    kafka:
      topic:
        actions-received: test.agent.actions.received
        actions-decided: test.agent.actions.decided
        actions-completed: test.agent.actions.completed
    rabbitmq:
      queue:
        approval-requests: test.approval.requests
        approval-notifications: test.approval.notifications
  security:
    jwt:
      # Test-only HS256 secret (>= 32 bytes). Never used outside tests.
      secret: agentops_test_only_placeholder_jwt_secret_for_unit_tests_minimum_thirtytwo_bytes
      expiration-minutes: 60
      issuer: agentops-firewall-test

logging:
  level:
    org.springframework.security: INFO
