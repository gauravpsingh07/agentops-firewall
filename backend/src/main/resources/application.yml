# ---------------------------------------------------------------------------
# AgentOps Firewall — base configuration.
#
# All sensitive values are read from environment variables. Defaults below
# are LOCAL-DEV PLACEHOLDERS only — they intentionally contain no real
# secrets and must be overridden via environment / .env in any non-trivial
# environment.
# ---------------------------------------------------------------------------

spring:
  application:
    name: agentops-firewall

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentops}
    username: ${SPRING_DATASOURCE_USERNAME:agentops}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_only}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agentops:
  messaging:
    kafka:
      topic:
        actions-received:  ${AGENTOPS_KAFKA_TOPIC_ACTIONS_RECEIVED:agent.actions.received}
        actions-decided:   ${AGENTOPS_KAFKA_TOPIC_ACTIONS_DECIDED:agent.actions.decided}
        actions-completed: ${AGENTOPS_KAFKA_TOPIC_ACTIONS_COMPLETED:agent.actions.completed}
  security:
    jwt:
      # Placeholder default — replace via JWT_SECRET env variable. The default
      # is intentionally long enough for HS256 (>= 32 bytes) but is NOT a real
      # secret and must be rotated in any deployment.
      secret: ${JWT_SECRET:agentops_local_dev_only_placeholder_jwt_secret_change_me_please_thirtytwo_plus}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: ${JWT_ISSUER:agentops-firewall}

logging:
  level:
    root: INFO
    com.agentops.firewall: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
