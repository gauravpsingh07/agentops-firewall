# ---------------------------------------------------------------------------
# AgentOps Firewall — base configuration.
#
# All sensitive values are read from environment variables. Defaults below
# are LOCAL-DEV PLACEHOLDERS only — they intentionally contain no real
# secrets and must be overridden via environment / .env in any non-trivial
# environment.
# ---------------------------------------------------------------------------

spring:
  application:
    name: agentops-firewall

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentops}
    username: ${SPRING_DATASOURCE_USERNAME:agentops}
    password: ${SPRING_DATASOURCE_PASSWORD:local_dev_only}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000
    consumer:
      group-id: ${AGENTOPS_KAFKA_CONSUMER_GROUP:agentops-firewall-metrics}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    # Defaults match the docker-compose `rabbitmq` service env vars so
    # a host-run backend (`mvnw spring-boot:run`) connects without
    # per-shell env overrides. RabbitMQ's built-in `guest` account is
    # restricted to loopback connections, so the previous `guest:guest`
    # defaults only worked from inside the broker container itself.
    username: ${SPRING_RABBITMQ_USERNAME:agentops}
    password: ${SPRING_RABBITMQ_PASSWORD:local_dev_only}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

agentops:
  messaging:
    # Broker consumers (Kafka action stream + RabbitMQ approval queue) that
    # project events into the in-memory live-metrics feed. Disable to run the
    # backend as a pure producer.
    consumers:
      enabled: ${AGENTOPS_MESSAGING_CONSUMERS_ENABLED:true}
      group-id: ${AGENTOPS_KAFKA_CONSUMER_GROUP:agentops-firewall-metrics}
    kafka:
      topic:
        actions-received:  ${AGENTOPS_KAFKA_TOPIC_ACTIONS_RECEIVED:agent.actions.received}
        actions-decided:   ${AGENTOPS_KAFKA_TOPIC_ACTIONS_DECIDED:agent.actions.decided}
        actions-completed: ${AGENTOPS_KAFKA_TOPIC_ACTIONS_COMPLETED:agent.actions.completed}
    rabbitmq:
      queue:
        approval-requests:      ${AGENTOPS_RABBITMQ_QUEUE_APPROVAL_REQUESTS:approval.requests}
        approval-notifications: ${AGENTOPS_RABBITMQ_QUEUE_APPROVAL_NOTIFICATIONS:approval.notifications}
  approvals:
    expiry:
      # Background sweep that expires PENDING approvals past their deadline.
      # Interval and initial delay are in milliseconds.
      check-interval-ms: ${AGENTOPS_APPROVAL_EXPIRY_INTERVAL_MS:60000}
      initial-delay-ms: ${AGENTOPS_APPROVAL_EXPIRY_INITIAL_DELAY_MS:60000}
  security:
    jwt:
      # Placeholder default — replace via JWT_SECRET env variable. The default
      # is intentionally long enough for HS256 (>= 32 bytes) but is NOT a real
      # secret and must be rotated in any deployment.
      secret: ${JWT_SECRET:agentops_local_dev_only_placeholder_jwt_secret_change_me_please_thirtytwo_plus}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: ${JWT_ISSUER:agentops-firewall}
    rate-limit:
      # Fixed-window throttling shed ahead of the security chain. Capacities
      # are per window in seconds, keyed by client IP (login) / agent key
      # (ingestion).
      enabled: ${AGENTOPS_RATE_LIMIT_ENABLED:true}
      login:
        capacity: ${AGENTOPS_RATE_LIMIT_LOGIN_CAPACITY:10}
        window-seconds: ${AGENTOPS_RATE_LIMIT_LOGIN_WINDOW:60}
      ingestion:
        capacity: ${AGENTOPS_RATE_LIMIT_INGESTION_CAPACITY:60}
        window-seconds: ${AGENTOPS_RATE_LIMIT_INGESTION_WINDOW:60}

logging:
  level:
    root: INFO
    com.agentops.firewall: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
